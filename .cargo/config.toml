# Cross-linking musl targets without a target-arch C toolchain: the pure
# Rust dependency tree links fine with rust-lld shipped by rustup.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"

[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"
