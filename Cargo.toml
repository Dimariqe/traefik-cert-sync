[package]
name = "traefik-cert-sync"
version = "2.0.0"
edition = "2021"
description = "Dump and distribute Let's Encrypt certificates from Traefik's acme.json — single static binary with authenticated server/agent sync"
license = "Apache-2.0"

[[bin]]
name = "traefik-cert-sync"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
